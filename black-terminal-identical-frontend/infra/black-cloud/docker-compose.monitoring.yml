name: black-cloud-observability

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    ports:
      - 127.0.0.1:19090:9090
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [observability, backplane]
    logging:
      driver: json-file
      options: { max-size: 25m, max-file: "5" }

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    env_file:
      - ${BLACK_CLOUD_MONITORING_ENV_FILE:-./secrets/monitoring.env}
    environment:
      GF_SERVER_HTTP_PORT: 3000
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - 127.0.0.1:13000:3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/black-cloud.yml:ro
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [observability]
    logging:
      driver: json-file
      options: { max-size: 25m, max-file: "5" }

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    pid: host
    volumes:
      - /:/host:ro,rslave
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [observability]

  cadvisor:
    image: ghcr.io/google/cadvisor:0.55.1
    restart: unless-stopped
    privileged: true
    command: [--docker_only=true, --housekeeping_interval=15s, --store_container_labels=false]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks: [observability]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    restart: unless-stopped
    env_file:
      - ${BLACK_CLOUD_MONITORING_ENV_FILE:-./secrets/monitoring.env}
    environment:
      DATA_SOURCE_URI: supabase-db:5432/postgres?sslmode=disable
      DATA_SOURCE_USER: postgres
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [observability, data]

networks:
  observability:
    name: black-cloud-observability
  backplane:
    external: true
    name: black-cloud-backplane
  data:
    external: true
    name: black-cloud-data

volumes:
  prometheus_data:
  grafana_data:
