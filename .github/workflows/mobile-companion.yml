name: Standalone mobile companion

on:
  workflow_dispatch:
  push:
    tags:
      - "mobile-v*"

permissions:
  contents: read

defaults:
  run:
    working-directory: black-terminal-identical-frontend

jobs:
  android:
    name: Android arm64 companion
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: black-terminal-identical-frontend/package-lock.json

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure Android NDK
        run: |
          if [ -n "${ANDROID_NDK_LATEST_HOME:-}" ]; then
            echo "NDK_HOME=${ANDROID_NDK_LATEST_HOME}" >> "$GITHUB_ENV"
          else
            ndk_home="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
            test -n "$ndk_home"
            echo "NDK_HOME=${ndk_home}" >> "$GITHUB_ENV"
          fi

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Initialize Android companion
        run: npm run tauri -- android init --ci

      - name: Build Android debug APK
        run: npm run tauri -- android build --debug --apk --target aarch64 --ci

      - name: Verify Android package
        run: |
          apk="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | head -1)"
          test -s "$apk"
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/.*\.so'
          sha256sum "$apk" | tee mobile-android-SHA256SUMS.txt

      - name: Upload Android companion
        uses: actions/upload-artifact@v4
        with:
          name: black-terminal-android-arm64-companion-debug
          path: |
            black-terminal-identical-frontend/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            black-terminal-identical-frontend/mobile-android-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
  ios:
    name: iOS simulator companion
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: black-terminal-identical-frontend/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Initialize iOS companion
        run: npm run tauri -- ios init --ci

      - name: Build unsigned iOS simulator app
        run: npm run tauri -- ios build --debug --target aarch64-sim --no-sign --ci

      - name: Verify iOS simulator package
        run: |
          app="$(find src-tauri/gen/apple -type d -name '*.app' | head -1)"
          test -n "$app"
          test -f "$app/Info.plist"
          executable="$(find "$app" -maxdepth 1 -type f -perm -111 | head -1)"
          test -n "$executable"
          file "$executable" | grep -q 'Mach-O.*arm64'
          ditto -c -k --keepParent "$app" mobile-ios-simulator-companion-debug.zip
          shasum -a 256 mobile-ios-simulator-companion-debug.zip > mobile-ios-SHA256SUMS.txt

      - name: Upload iOS simulator companion
        uses: actions/upload-artifact@v4
        with:
          name: black-terminal-ios-simulator-companion-debug
          path: |
            black-terminal-identical-frontend/mobile-ios-simulator-companion-debug.zip
            black-terminal-identical-frontend/mobile-ios-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
