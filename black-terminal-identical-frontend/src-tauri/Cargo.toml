[package]
name = "black-terminal-pixi"
version = "1.0.7"
description = "Black Terminal local-first professional crypto trading and strategy automation terminal"
authors = ["Black Triangle Group"]
license = ""
repository = "https://github.com/danielnotexist404/Black-Terminal"
edition = "2021"

[lib]
name = "black_terminal_pixi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dependencies]
tauri = { version = "2.5", features = ["tray-icon", "image-ico", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
base64 = "0.22"
aes-gcm = "0.10"
futures = "0.3"
hmac = "0.12"
keyring-core = "1"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1-rustls-tls"] }
libp2p = { version = "0.56", default-features = false, features = ["cbor", "dcutr", "dns", "ed25519", "gossipsub", "identify", "kad", "macros", "mdns", "noise", "relay", "rendezvous", "request-response", "tcp", "tokio", "upnp", "yamux"] }
rusqlite = { version = "0.38", features = ["bundled"] }
rust_decimal = "1.40"
sha2 = "0.10"
urlencoding = "2.1"
zeroize = "1.9"

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain", "protected"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[dev-dependencies]
tempfile = "3"
