services:
  qalc-data-init:
    image: alpine:3.22.1
    command: ["sh", "-c", "mkdir -p /var/lib/black-terminal/qalc/events /var/lib/black-terminal/qalc/state && chown -R 10001:10001 /var/lib/black-terminal/qalc && chmod 0750 /var/lib/black-terminal/qalc /var/lib/black-terminal/qalc/events /var/lib/black-terminal/qalc/state"]
    user: "0:0"
    read_only: true
    network_mode: none
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ${QALC_DATA_PATH:-/srv/black-terminal/data/qalc}:/var/lib/black-terminal/qalc

  qalc-worker:
    image: ${QALC_IMAGE_REFERENCE:?Use an immutable commit-tagged BC-QALC image}
    pull_policy: never
    container_name: black-core-qalc
    hostname: black-core-qalc
    restart: unless-stopped
    init: true
    environment:
      QALC_SYMBOL: ${QALC_SYMBOL:-BTCUSDT}
      QALC_MODE: ${QALC_MODE:-RESEARCH}
      QALC_PAPER_ENABLED: ${QALC_PAPER_ENABLED:-false}
      QALC_LIVE_EXECUTION_ENABLED: "false"
      QALC_GROUP_FANOUT_ENABLED: "false"
      QALC_ARCHIVE_ROOT: /var/lib/black-terminal/qalc/events
      QALC_STATE_PATH: /var/lib/black-terminal/qalc/state/current.json
    volumes:
      - ${QALC_DATA_PATH:-/srv/black-terminal/data/qalc}:/var/lib/black-terminal/qalc
    depends_on:
      qalc-data-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 128
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "5"
    networks:
      - qalc-egress

networks:
  qalc-egress:
    internal: false
