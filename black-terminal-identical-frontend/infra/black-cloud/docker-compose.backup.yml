name: black-cloud-backup

services:
  backup:
    image: black-cloud-backup:${BLACK_CLOUD_DEPLOYMENT_COMMIT:?set BLACK_CLOUD_DEPLOYMENT_COMMIT}
    build:
      context: ../..
      dockerfile: infra/black-cloud/Dockerfile.backup
    restart: unless-stopped
    env_file:
      - ${BLACK_CLOUD_BACKUP_ENV_FILE:-./secrets/backup.env}
    environment:
      PGHOST: supabase-db
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: postgres
      RESTIC_CACHE_DIR: /tmp/restic-cache
    volumes:
      - ${BLACK_CLOUD_SUPABASE_STATE_ROOT:-/var/lib/black-cloud/supabase}/storage:/source/storage:ro
      - ${BLACK_CLOUD_LOCAL_RESTIC_PATH:-/var/lib/black-cloud/restic}:/repository
      - backup_staging:/staging
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [data]
    logging:
      driver: json-file
      options: { max-size: 25m, max-file: "5" }

networks:
  data:
    external: true
    name: black-cloud-data

volumes:
  backup_staging:
