groups:
  - name: black-cloud
    rules:
      - alert: BlackCloudApiDown
        expr: up{job="black-cloud-api"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: Black Cloud central API is unavailable
      - alert: BlackCloudPostgresDown
        expr: pg_up == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: Black Cloud PostgreSQL is unavailable
      - alert: BlackCloudDiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.15
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: Black Cloud root disk has less than 15 percent free space
      - alert: BlackCloudMemoryPressure
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) < 0.10
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: Black Cloud has less than 10 percent available memory
