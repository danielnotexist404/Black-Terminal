services:
  frontend:
    image: ${BLACK_CLOUD_FRONTEND_IMAGE:?set BLACK_CLOUD_FRONTEND_IMAGE to the immutable release image}

  api:
    image: ${BLACK_CLOUD_API_IMAGE:?set BLACK_CLOUD_API_IMAGE to the immutable release image}
    environment:
      BLACK_CLOUD_DEPLOYMENT_COMMIT: ${BLACK_CLOUD_DEPLOYMENT_COMMIT}

  strategy-automation-worker:
    image: ${BLACK_CLOUD_RUNTIME_IMAGE:?set BLACK_CLOUD_RUNTIME_IMAGE to the immutable release image}
    environment:
      BLACK_CLOUD_DEPLOYMENT_COMMIT: ${BLACK_CLOUD_DEPLOYMENT_COMMIT}
      BLACK_CLOUD_IMAGE_REFERENCE: ${BLACK_CLOUD_RUNTIME_IMAGE}
      BLACK_CLOUD_IMAGE_DIGEST: ${BLACK_CLOUD_IMAGE_DIGEST:?set BLACK_CLOUD_IMAGE_DIGEST}

  black-cloud-demo-execution-worker:
    image: ${BLACK_CLOUD_RUNTIME_IMAGE:?set BLACK_CLOUD_RUNTIME_IMAGE to the immutable release image}
    environment:
      BLACK_CLOUD_DEPLOYMENT_COMMIT: ${BLACK_CLOUD_DEPLOYMENT_COMMIT}
      BLACK_CLOUD_IMAGE_REFERENCE: ${BLACK_CLOUD_RUNTIME_IMAGE}
      BLACK_CLOUD_IMAGE_DIGEST: ${BLACK_CLOUD_IMAGE_DIGEST:?set BLACK_CLOUD_IMAGE_DIGEST}

  black-cloud-execution-worker:
    image: ${BLACK_CLOUD_RUNTIME_IMAGE:?set BLACK_CLOUD_RUNTIME_IMAGE to the immutable release image}
    environment:
      BLACK_CLOUD_DEPLOYMENT_COMMIT: ${BLACK_CLOUD_DEPLOYMENT_COMMIT}
      BLACK_CLOUD_IMAGE_REFERENCE: ${BLACK_CLOUD_RUNTIME_IMAGE}
      BLACK_CLOUD_IMAGE_DIGEST: ${BLACK_CLOUD_IMAGE_DIGEST:?set BLACK_CLOUD_IMAGE_DIGEST}
